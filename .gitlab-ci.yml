image: openjdk:17-jdk

stages:
  - build

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_SDK_TOOLS: "9477386"

build_apk:
  stage: build
  before_script:
    - apt-get --quiet update --yes
    - apt-get --quiet install --yes wget tar unzip lib32stdc++6 lib32z1
    - wget --quiet --output-document=android-sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip
    - unzip -d android-sdk-linux android-sdk.zip
    - export ANDROID_HOME=$PWD/android-sdk-linux/cmdline-tools
    - export PATH=$PATH:$ANDROID_HOME/bin
    - mkdir -p $ANDROID_HOME
    - mv android-sdk-linux/cmdline-tools $ANDROID_HOME/latest
    - echo y | sdkmanager --sdk_root=${ANDROID_HOME}/.. "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"
  script:
    - export ANDROID_HOME=$PWD/android-sdk-linux
    - export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin
    - chmod +x gradlew
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 30 days
  only:
    - main
    - master
    - tags
